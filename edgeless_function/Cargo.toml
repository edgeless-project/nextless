[package]
name = "edgeless_function"
version = "0.1.0"
authors = ["Raphael Hetzel <hetzel@in.tum.de>"]
edition = "2021"

[lib]
name = "edgeless_function"
path = "src/lib.rs"

[features]
std = []
alloc = []
default = ["std"]

[dependencies]
allocator-api2 = { version = "0.2.8", default-features = false, features = [
    "alloc",
] }
log = "0.4"
edgeless_actor_abi = { path = "../edgeless_actor_abi" }
edgeless_function_macro = { path = "../edgeless_function_macro" }
edgeless_function_core = { path = "../edgeless_function_core" }
static_cell = { version = "2" }
