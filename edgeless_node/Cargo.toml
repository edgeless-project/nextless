[package]
name = "edgeless_node"
version = "0.1.0"
authors = ["Raphael Hetzel <hetzel@in.tum.de>"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "edgeless_node"
path = "src/lib.rs"

[[bin]]
name = "edgeless_node_d"
path = "src/bin/edgeless_node_d.rs"

[features]
default = ["wasmtime"]
# WASM runtime; You can only pick one!
wasmtime = []
wasmi = []

[dependencies]
log = "0.4"
env_logger = "0.10"
tokio = { version = "1", features = ["full"] }
futures = { version = "0.3", features = ["executor"] }
anyhow = "1.0"
uuid = { version = "1.3", features = ["v4", "serde"] }
async-trait = "0.1"
wasmtime = { version = "31" }
serde = "1.0"
serde_json = "1.0"
clap = { version = "4.3", features = ["derive"] }
toml = "0.7"
edgeless_api = { path = "../edgeless_api", features = ["grpc_impl"] }
edgeless_telemetry = { path = "../edgeless_telemetry" }
edgeless_dataplane = { path = "../edgeless_dataplane" }
edgeless_http = { path = "../edgeless_http", features = ["hyper"] }
hyper = { version = "1.2", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.11" }
http-body-util = "0.1.0-rc.3"
redis = "*"
openssl = { version = "0.10", features = ["vendored"] }
sysinfo = "0.37"
wasmi = { version = "0.40", default-features = false }
base64 = "0.21.5"
chrono = "0.4.38"

opentelemetry = "0.27"

wgpu = { version = "27", features = ["serde"] }

thiserror = "2"

talc = { version = "4.4", default-features = false, features = [
    "allocator-api2",
    "lock_api",
] }

allocator-api2 = "0.2.8"
edgeless_actor_abi = { path = "../edgeless_actor_abi" }
spin = { version = "0.10", features = ["lock_api"] }

rustix = { version = "1", features = ["mm"] }

elfloader = { git = "https://github.com/raphaelhetzel/rust-elfloader.git", branch = "so_fixes" }


[build-dependencies]
tonic-build = "0.10"
