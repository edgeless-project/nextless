[package]
name = "edgeless_embedded"
version = "0.1.0"
authors = ["Raphael Hetzel <hetzel@in.tum.de>>"]
edition = "2021"
resolver = "2"

[lib]
name = "edgeless_embedded"
path = "src/lib.rs"

[dependencies]
embedded-hal = "1"

log = { version = "0.4", default-features = false }
cfg-if = "1.0"

embassy-executor = { version = "0.9" }
embassy-sync = { version = "0.7" }
embassy-time = { version = "0.5" }
embassy-net = { version = "0.7", features = [
    "tcp",
    "udp",
    "dhcpv4",
    "medium-ethernet",
    "proto-ipv4",
] }
embassy-futures = { version = "0.1" }


static_cell = { version = "1.2.0" }
heapless = { version = "0.9", features = ["ufmt"] }
ufmt = "0.2"

uuid = { version = "1.3", default-features = false, features = ["v4"] }

edgeless_api_core = { path = "../edgeless_api_core" }

coap-lite = { version = "0.11", default-features = false }
minicbor = { version = "0.19", default-features = false, features = ["derive"] }

wasmi = { version = "0.40", default-features = false, features = [] }


[features]
wasm = []
nightly = ["embassy-executor/nightly"]
alloc_static = []
