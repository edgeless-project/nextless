[package]
name = "edgeless_function_types"
version = "0.1.0"
authors = ["Raphael Hetzel <hetzel@in.tum.de>"]
edition = "2021"

[lib]
name = "edgeless_function_types"
path = "src/lib.rs"

[dependencies]
edgeless_function_core = { path = "../edgeless_function_core" }
log = "0.4"
serde_json = { version = "1.0", features = ["alloc"], default-features = false }
serde = { version = "1.0", features = ["derive"], default-features = false }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "bmp",
], optional = true }

embedded-graphics = {version = "0.8" }

[features]
default = ["std"]
vision = ["std", "dep:image"]
std = []
