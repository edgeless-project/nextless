name: Build and Push Nextless Containers
on:
  push:
    branches:
      - development
jobs:
  build-arm64-containers:
    runs-on:
      - ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix build .#containers.aarch64-linux.nextless_playground --out-link container-nextless_playground-arm64
        shell: bash
      - uses: actions/upload-artifact@v6
        with:
          name: container-nextless_playground-arm64
          path: container-nextless_playground-arm64
  build-amd64-containers:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix build .#containers.x86_64-linux.nextless_playground --out-link container-nextless_playground-amd64
        shell: bash
      - uses: actions/upload-artifact@v6
        with:
          name: container-nextless_playground-amd64
          path: container-nextless_playground-amd64
  merge_and_push_containers:
    needs:
      - build-arm64-containers
      - build-amd64-containers
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: container-nextless_playground-arm64
      - uses: actions/download-artifact@v8
        with:
          name: container-nextless_playground-amd64
      - uses: docker/setup-docker-action@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # https://tech.aufomm.com/how-to-build-multi-arch-docker-image-on-nixos/#Tag-multi-arch
      - run: |
          docker load < container-nextless_playground-arm64
          docker load < container-nextless_playground-amd64
          echo "Tag Images"
          docker image tag nextless_playground:latest-arm64 ghcr.io/edgeless-project/nextless_playground:latest-arm64
          docker image tag nextless_playground:latest-amd64 ghcr.io/edgeless-project/nextless_playground:latest-amd64
          echo "Push Images"
          docker push ghcr.io/edgeless-project/nextless_playground:latest-arm64
          docker push ghcr.io/edgeless-project/nextless_playground:latest-amd64
          echo "Create Manifest"
          docker manifest create ghcr.io/edgeless-project/nextless_playground:latest ghcr.io/edgeless-project/nextless_playground:latest-arm64 ghcr.io/edgeless-project/nextless_playground:latest-amd64
          echo "Update Manifest"
          docker manifest annotate ghcr.io/edgeless-project/nextless_playground:latest ghcr.io/edgeless-project/nextless_playground:latest-arm64 --arch arm64 --os linux
          docker manifest annotate ghcr.io/edgeless-project/nextless_playground:latest ghcr.io/edgeless-project/nextless_playground:latest-amd64 --arch amd64 --os linux
          echo "Push Manifest"
          docker manifest push ghcr.io/edgeless-project/nextless_playground:latest
        shell: bash
