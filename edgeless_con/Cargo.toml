[package]
name = "edgeless_con"
version = "0.1.0"
authors = ["Raphael Hetzel <hetzel@in.tum.de>"]
edition = "2021"

[lib]
name = "edgeless_con"
path = "src/lib.rs"

[[bin]]
name = "edgeless_con_d"
path = "src/bin/edgeless_con_d.rs"

[features]
default = ["otel"]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]

[dependencies]

tokio = { version = "1", features = ["full"] }
futures = "0.3"
anyhow = "1.0"
uuid = {version= "1.3", features = ["v4", "serde"] }
async-trait = "0.1"
edgeless_api = {path = "../edgeless_api", features = ["grpc_impl"]}
edgeless_build = {path = "../edgeless_build"}
edgeless_link_multicast = {path = "../edgeless_link_multicast"}
serde = "1.0"
serde_json = "1"
clap = { version = "4.3", features=["derive"] }
toml = "0.7"
rand = { version = "0.8" }
prometheus-http-query = "0.8.3"
thiserror = {version = "2" }

tracing = { version = "0.1" }
tracing-subscriber = {version = "0.3", features = ["env-filter"]}
opentelemetry = {version  = "0.31", optional = true }
opentelemetry_sdk = { version = "0.31", optional = true }
opentelemetry-otlp = { version = "0.31", optional = true }
tracing-opentelemetry = {version = "0.32", optional = true }
