[workspace]

[profile.dev]
panic = "abort"

[profile.release]
lto = true
opt-level = "z"
panic = "abort"
codegen-units = 1
strip = true

[package]
name = "gpu_example"
version = "0.1.0"
authors = ["Raphael Hetzel <hetzel@in.tum.de>"]
edition = "2021"
include = ["src/**/*", "function.json", "*.star"]

[lib]
name = "gpu_example"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
edgeless_function = { path = "../../edgeless_function" }
edgeless_function_core = { path = "../../edgeless_function_core" }
edgeless_function_gpu = { path = "../../edgeless_function_gpu" }
log = "0.4"
pollster = "0.4"
bytemuck = "1"
serde = "1"
serde_json = "1.0"

[features]

input_trigger = []
