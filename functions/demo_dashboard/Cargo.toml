[workspace]

[profile.dev]
panic = "abort"

[profile.release]
lto = true
opt-level = "z"
panic = "abort"
codegen-units = 1
strip = true

[package]
name = "demo_dashboard"
version = "0.1.0"
authors = ["Raphael Hetzel <hetzel@in.tum.de>"]
edition = "2021"
include = ["src/**/*", "function.json", "*.star"]

[lib]
name = "demo_dashboard"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
edgeless_function = { git = "https://github.com/edgeless-project/nextless.git", branch = "development", package = "edgeless_function" }
edgeless_function_types = { git = "https://github.com/edgeless-project/nextless.git", branch = "development", package = "edgeless_function_types" }
edgeless_http = { git = "https://github.com/edgeless-project/nextless.git", branch = "development", package = "edgeless_http" }
log = "0.4"
serde = {version="1", features=["derive"] }
serde_json = "1"
uuid = { version = "1.19", features = ["serde"] }

[features]

input_data_in = []
input_http_fetch = []
