[workspace]

[profile.dev]
panic = "abort"

[profile.release]
lto = true
opt-level = "z"
panic = "abort"
codegen-units = 1
strip = true

[package]
name = "esp_test_fun"
version = "0.1.0"
authors = ["Raphael Hetzel <hetzel@in.tum.de>"]
edition = "2021"
include = ["src/**/*", "function.json", "*.star"]

[lib]
name = "esp_test_fun"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
edgeless_function = { path = "../../edgeless_function", default-features = false }
# edgeless_function = { git = "https://github.com/edgeless-project/nextless.git", branch = "development", package = "edgeless_function" }
log = "0.4"
edgeless_function_core = { path = "../../edgeless_function_core" }

# minicbor = { version = "0.19", default-features = false, features = ["derive"] }
[features]
default = ["output_message", "input_measurement"]
output_message = []
input_measurement = []
