[workspace]

[profile.dev]
panic = "abort"

[profile.release]
lto = true
opt-level = "z"
panic = "abort"
codegen-units = 1
strip = true

[package]
name = "yolox_example"
version = "0.1.0"
authors = ["Raphael Hetzel <hetzel@in.tum.de>"]
edition = "2021"
include = ["src/**/*", "data/**/*", "function.json", "*.star"]

[lib]
name = "yolox_example"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
edgeless_function = { git = "https://github.com/edgeless-project/nextless.git", branch = "development", package = "edgeless_function" }
edgeless_function_core = { git = "https://github.com/edgeless-project/nextless.git", branch = "development", package = "edgeless_function_core" }
edgeless_function_types = { git = "https://github.com/edgeless-project/nextless.git", branch = "development", package = "edgeless_function_types", features = ["vision", "std"] }
edgeless_actor_abi = { git = "https://github.com/edgeless-project/nextless.git", branch = "development", package = "edgeless_actor_abi" }
edgeless_function_gpu = { git = "https://github.com/edgeless-project/nextless.git", branch = "development", package = "edgeless_function_gpu" }
wonnx = { git = "https://github.com/raphaelhetzel/wonnx.git", branch = "wgpu_custom", default-features = false, features = [
    "custom",
] }
log = "0.4"
pollster = "0.4"
bytemuck = "1"
serde = "1"
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Disabled as this needs getrandom with wasm-bindgen
# imageproc = { version = "0.25.0", default-features = false }
itertools = { version = "0.14" }


[features]

default = ["input_image", "output_detection"]

input_image = []
output_detection = []
output_annotated_image = []
